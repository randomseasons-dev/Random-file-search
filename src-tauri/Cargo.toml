[package]
name = "internet-file-searcher"
version = "1.2.0"
description = "Internet File Searcher"
authors = ["RandomSeasons"]
edition = "2021"

[lib]
name = "internet_file_searcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "cookies"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["time", "fs", "io-util", "net"] }

[profile.release]
opt-level = 3
lto = "thin"
